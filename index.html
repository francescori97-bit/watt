<style>
:root {
  /* consolle scura: antracite, pannelli scuri, arancione come colore d'azione; zone con colori fissi ovunque */
  --bg: #16181d;
  --panel: #21242b;
  --panel2: #2b2f38;
  --line: #3a3f4b;
  --fg: #f3f4f6;
  --mut: #9ba3b0;
  --acc: #ff6a1a;
  --acc-ink: #1a0d04;
  --ok: #4cc38a;
  --bad: #f0483e;
  --warn: #f5c542;
  --z1: #8b929e;
  --z2: #3b9eff;
  --z3: #4cc38a;
  --z4: #f5c542;
  --z5: #ff8a3d;
  --z6: #f0483e;
  --z7: #b072ff;
  --c-virt: #ff6a1a;
  --c-indoor: #ffb37d;
  --c-outdoor: #3b9eff;
  --c-other: #6b7380;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--acc); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 10px 16px; background: rgba(22, 24, 29, .96); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .12em; color: var(--acc); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a { color: var(--mut); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.tabs a.on { color: var(--fg); background: var(--panel2); box-shadow: inset 0 -2px 0 var(--acc); }
main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 640px) {
  .top { justify-content: center; padding: 6px 12px; }
  .brand { font-size: 20px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #1b1e24; border-top: 1px solid var(--line); gap: 0; flex-wrap: nowrap; }
  .tabs a { flex: 1; text-align: center; padding: 14px 2px; border-radius: 0; font-size: 13px; }
  .tabs a.on { box-shadow: inset 0 2px 0 var(--acc); }
  main { padding: 12px 12px 76px; }
}

h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 17px; text-transform: uppercase; color: var(--mut); }
p { margin: 0; }
.mut { color: var(--mut); }
.small { font-size: 13px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; min-height: 40px; }
.btn:hover { border-color: var(--mut); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
.btn.pri:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }

.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--mut); font-weight: 500; min-height: 32px; }
.seg button.on { background: var(--panel2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--acc); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--mut); font-size: 13px; min-height: 32px; }
.chip.on { border-color: var(--acc); color: var(--fg); background: rgba(255, 106, 26, .14); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
input[type=number], input[type=date], select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; max-width: 180px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--acc); }

.status { font-size: 13px; color: var(--mut); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mut); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--bad); } .dot.run { background: var(--warn); }
.note { font-size: 13px; color: var(--mut); border-left: 3px solid var(--line); padding-left: 10px; }
.note.warn { border-color: var(--warn); } .note.bad { border-color: var(--bad); color: var(--fg); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.tile .lab { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.tile .val { font-family: var(--display); font-weight: 600; font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .val small { font-size: 16px; color: var(--mut); font-weight: 500; margin-left: 3px; }
.tile .sub { font-size: 12px; color: var(--mut); }
.up { color: var(--ok); } .down { color: var(--warn); }

.chart { min-height: 120px; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--mut); font-family: var(--body); font-size: 11px; }
.chart text.v { fill: var(--fg); font-family: var(--display); font-size: 13px; font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--mut); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.empty { color: var(--mut); font-size: 13px; padding: 16px 0; }

.zrows { display: flex; flex-direction: column; gap: 6px; }
.zrow { display: grid; grid-template-columns: 120px 1fr 86px; gap: 8px; align-items: center; font-size: 13px; }
.zrow .bar { height: 12px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.zrow .bar i { display: block; height: 100%; }
.zrow .t { text-align: right; font-variant-numeric: tabular-nums; color: var(--mut); }
.zc { display: inline-block; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 4px; font-family: var(--display); font-weight: 600; color: #111; margin-right: 6px; }
.z1 { background: var(--z1); } .z2 { background: var(--z2); } .z3 { background: var(--z3); } .z4 { background: var(--z4); } .z5 { background: var(--z5); } .z6 { background: var(--z6); } .z7 { background: var(--z7); }

.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--mut); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { white-space: normal; min-width: 160px; }
th.r, td.r { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel2); }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut); margin-left: 6px; white-space: nowrap; }
.badge.virt { border-color: var(--c-virt); color: var(--c-virt); } .badge.indoor { border-color: var(--c-indoor); color: var(--c-indoor); } .badge.outdoor { border-color: var(--c-outdoor); color: var(--c-outdoor); }

.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.wk { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.wk.sel { border-color: var(--acc); }
.wk h4 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: .02em; }
.wk .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--mut); }
.wk .meta b { color: var(--fg); font-family: var(--display); font-size: 15px; font-weight: 600; }
.wsvg { display: block; width: 100%; height: 64px; background: var(--bg); border-radius: 6px; }
.ivl { display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
.ivl div { display: flex; gap: 8px; align-items: baseline; }
.ivl .d { min-width: 48px; text-align: right; color: var(--mut); }

.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .65); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div span { display: block; font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.kv div b { font-family: var(--display); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: #0f1114; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; max-width: 260px; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }

/* ---------- Consolle a tutto schermo: grafico, target, timer, FC + zona, tempo trascorso ---------- */
.cs { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; gap: 8px; padding: 8px 10px 10px; height: 100%; overflow: hidden;
  grid-template-columns: 1fr;
  grid-template-rows: minmax(0, 1.25fr) clamp(76px, 14vh, 160px) minmax(0, 1fr) minmax(0, 1fr) auto auto auto auto;
  grid-template-areas: 'it' 'ch' 'p1' 'p2' 'el' 'top' 'ctl' 'msg'; }
.cs-top { grid-area: top; display: flex; padding: 0 2px; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mut); min-height: 24px; }
.cs-top b { color: var(--fg); font-family: var(--display); font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-conn { display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.cs-chart { grid-area: ch; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cs-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cs-done { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0, 0, 0, .45); }
.cs-cur { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px #000, 0 0 10px #fff; }
.cs-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 0; min-width: 0; overflow: hidden; text-align: center; }
.cs-cell label { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; }
.cs-cell b { font-family: var(--display); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
.cs-cell b small { font-size: .38em; color: var(--mut); font-weight: 500; margin-left: 6px; }
.cs-cell .s { font-size: 14px; color: var(--mut); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cs-tg b { font-size: clamp(44px, 9.5vh, 110px); color: var(--acc); }
.cs-it { grid-area: it; border-top: 4px solid var(--z1); } .cs-it b { font-size: clamp(60px, 12.5vh, 160px); }
.cs-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0; }
.cs-p1 { grid-area: p1; } .cs-p2 { grid-area: p2; }
.cs-hr b { font-size: clamp(40px, 9vh, 96px); color: #ff5d73; }
.cs-hr b.na { color: var(--mut); font-size: clamp(30px, 6vh, 64px); }
.cs-zn b { font-size: clamp(38px, 8.5vh, 92px); color: #111; border-radius: 10px; padding: 2px 18px; }
.cs-zn b.na { color: var(--mut); background: transparent; font-size: clamp(30px, 6vh, 64px); }
.cs-el { grid-area: el; padding: 6px 12px; }
.cs-el b { font-size: clamp(30px, 5vh, 56px); }
.cs-el .bar { width: 100%; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
.cs-el .bar i { display: block; height: 100%; width: 0; background: var(--acc); }
.cs-ctl { grid-area: ctl; display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; }
.cs-ctl .btn { min-height: 56px; font-size: 18px; font-family: var(--display); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.cs-msg { grid-area: msg; color: var(--warn); font-size: 13px; text-align: center; }
.cs-msg:empty { display: none; }
.cs-confirm { position: absolute; inset: 0; background: rgba(0, 0, 0, .78); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 3; }
.cs-confirm .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.cs-confirm .btn { min-height: 52px; }
.cs.paused .cs-it b { color: var(--warn); }
@media (orientation: portrait) and (max-height: 720px) {
  .cs { gap: 6px; padding: 6px 8px 8px; grid-template-rows: minmax(0, 1.2fr) clamp(54px, 11vh, 96px) minmax(0, 1fr) minmax(0, 1fr) auto auto auto auto; }
  .cs-cell { padding: 2px 8px; }
  .cs-cell label { font-size: 10px; }
  .cs-cell .s { font-size: 12px; min-height: 15px; }
  .cs-it b { font-size: clamp(46px, 10.5vh, 90px); }
  .cs-tg b, .cs-hr b { font-size: clamp(28px, 6.5vh, 58px); }
  .cs-zn b { font-size: clamp(26px, 6vh, 54px); padding: 0 12px; }
  .cs-zn b.na, .cs-hr b.na { font-size: clamp(22px, 5vh, 40px); }
  .cs-el { flex-direction: row; gap: 10px; padding: 4px 10px; }
  .cs-el label { display: none; }
  .cs-el b { font-size: 26px; }
  .cs-el .bar { flex: 1; margin: 0; }
  .cs-top { min-height: 18px; } .cs-top b { font-size: 15px; }
  .cs-ctl .btn { min-height: 48px; font-size: 16px; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .cs { grid-template-columns: 1fr 1fr 150px;
    grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr) auto auto;
    grid-template-areas: 'it ch ctl' 'p1 p2 ctl' 'el el ctl' 'top top msg'; }
  .cs-ctl { grid-template-columns: 1fr; grid-template-rows: 2fr 1fr auto; }
  .cs-cell { padding: 2px 6px; }
  .cs-cell .s { font-size: 11px; min-height: 14px; }
  .cs-tg b { font-size: clamp(28px, 13vh, 72px); }
  .cs-it b { font-size: clamp(48px, 24vh, 130px); }
  .cs-hr b, .cs-zn b { font-size: clamp(22px, 9vh, 48px); }
  .cs-hr b.na { font-size: clamp(18px, 7vh, 36px); }
  .cs-el { flex-direction: row; gap: 12px; padding: 4px 10px; }
  .cs-el b { font-size: clamp(22px, 8vh, 40px); }
  .cs-el .bar { flex: 1; margin: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .cs-el .bar i, .cs-cur, .cs-done { transition: all .25s linear; }
}

<script>
/* WATT core: motore workout, metriche, parser dispositivi. Nessun accesso a DOM o rete. */
(function (root) {
  'use strict';
  const W = {};

  /* ---------- Zone di potenza (Coggan, frazione di FTP) ---------- */
  W.PZ = [
    { z: 1, name: 'Recupero', hi: 0.55 },
    { z: 2, name: 'Endurance', hi: 0.75 },
    { z: 3, name: 'Tempo', hi: 0.90 },
    { z: 4, name: 'Soglia', hi: 1.05 },
    { z: 5, name: 'VO₂max', hi: 1.20 },
    { z: 6, name: 'Anaerobico', hi: 1.50 },
    { z: 7, name: 'Neuromuscolare', hi: Infinity }
  ];
  W.zoneOfFrac = function (f) {
    for (const z of W.PZ) if (f <= z.hi + 1e-9) return z.z;
    return 7;
  };
  W.zoneOfWatts = function (w, ftp) {
    if (w == null || !isFinite(w) || !ftp) return null;
    return W.zoneOfFrac(w / ftp);
  };
  /* zone cardiache: array di 5 limiti superiori [z1max, z2max, z3max, z4max] (z5 aperta) */
  W.zoneOfHr = function (bpm, maxes) {
    if (bpm == null || !isFinite(bpm) || !maxes || maxes.length < 4) return null;
    for (let i = 0; i < 4; i++) if (bpm <= maxes[i]) return i + 1;
    return 5;
  };
  W.targetWatts = function (ftp, frac) {
    return ftp ? Math.round(ftp * frac) : null;
  };

  /* ---------- Workout: DSL -> blocchi {d: secondi, p: frazione FTP, k: tipo} ---------- */
  function ramp(kind, minutes) {
    const steps = kind === 'wu' ? Math.min(5, minutes) : Math.min(4, minutes);
    const d = (minutes * 60) / steps;
    const from = kind === 'wu' ? 0.45 : 0.60, to = kind === 'wu' ? 0.75 : 0.40;
    const out = [];
    for (let j = 0; j < steps; j++) {
      const p = steps === 1 ? (from + to) / 2 : from + ((to - from) * j) / (steps - 1);
      out.push({ d: d, p: Math.round(p * 100) / 100, k: kind });
    }
    return out;
  }
  W.parseDsl = function (s) {
    let i = 0;
    function item() {
      const rest = s.slice(i);
      let m = /^(\d+)x\(/.exec(rest);
      if (m) {
        i += m[0].length;
        const inner = seq(')');
        if (s[i] !== ')') throw new Error('DSL: parentesi non chiusa in ' + s);
        i++;
        const r = [];
        for (let k = 0; k < +m[1]; k++) inner.forEach(b => r.push(Object.assign({}, b)));
        return r;
      }
      m = /^(wu|cd)(\d+)/.exec(rest);
      if (m) { i += m[0].length; return ramp(m[1], +m[2]); }

  const HARD = ['VO₂max 5×5 al 110%', 'Sopra soglia 6×5 alternati', '30/15 Rønnestad', '40/20 quattro serie', 'VO₂max a scalare 5×3', 'Piramide VO₂max', 'Seiler 4×8', '2×20 alla soglia', 'Soglia 3×12 al 103%', 'Partenza forte 4×8', 'Sopra/sotto duro 3×12', 'Sweet spot 2×45', 'Forza e soglia', 'Tabata doppio', 'Sprint 10×15″', 'Capacità anaerobica 6×1′', 'Test a rampa (FTP)'];

  W.total = function (blocks) { let t = 0; for (const b of blocks) t += b.d; return t; };

  W.LIB = SRC.map(function (r, idx) {

  }).concat(SRC_PRO.map(function (r, idx) {
    const blocks = W.parseDsl(r[3]), T = W.total(blocks);
    return Object.assign({ id: 'pro-' + r[0] + '-' + idx, goal: r[0], name: r[1], desc: r[2], dur: Math.round(T / 60), blocks: blocks, why: r[4], how: r[5], pro: true, hard: HARD.indexOf(r[1]) >= 0 }, r[7] || {});

  /* Stima dai soli target (non è un dato misurato): IF = radice quarta della media di p^4 pesata sul tempo. */
  W.planStats = function (blocks) {
    const T = W.total(blocks);
    let s4 = 0, s1 = 0;
    for (const b of blocks) { s4 += Math.pow(b.p, 4) * b.d; s1 += b.p * b.d; }
    const IF = Math.pow(s4 / T, 0.25);
    return { sec: T, avg: s1 / T, IF: IF, tss: (T * IF * IF) / 36 };
  };

  W.blockLabel = function (b) {
    if (b.k === 'wu') return 'Riscaldamento';

    return W.PZ[W.zoneOfFrac(b.p) - 1].name;
  };

  /* posizione nel workout a partire dai secondi trascorsi */
  W.locate = function (blocks, sec) {
    const T = W.total(blocks);
    if (sec >= T) return { done: true, idx: blocks.length - 1, into: blocks[blocks.length - 1].d, left: 0, total: T };
    let acc = 0;
    for (let i = 0; i < blocks.length; i++) {
      if (sec < acc + blocks[i].d) return { done: false, idx: i, into: sec - acc, left: acc + blocks[i].d - sec, total: T };
      acc += blocks[i].d;
    }
    return { done: true, idx: blocks.length - 1, into: 0, left: 0, total: T };
  };

  /* ---------- Timer basato sull'orologio, non su un contatore ---------- */
  W.Timer = function (nowFn) {
    this.now = nowFn || function () { return Date.now(); };
    this.startAt = null; this.pausedAt = null; this.pausedMs = 0; this.endAt = null;
  };
  W.Timer.prototype.start = function () { this.startAt = this.now(); this.pausedAt = null; this.pausedMs = 0; this.endAt = null; };
  W.Timer.prototype.pause = function (at) { if (this.startAt != null && this.pausedAt == null && this.endAt == null) this.pausedAt = at != null ? at : this.now(); };
  W.Timer.prototype.resume = function () { if (this.pausedAt != null) { this.pausedMs += this.now() - this.pausedAt; this.pausedAt = null; } };
  W.Timer.prototype.stop = function () { if (this.endAt == null) this.endAt = this.pausedAt != null ? this.pausedAt : this.now(); };
  W.Timer.prototype.running = function () { return this.startAt != null && this.pausedAt == null && this.endAt == null; };
  W.Timer.prototype.elapsedMs = function () {
    if (this.startAt == null) return 0;
    const t = this.endAt != null ? this.endAt : (this.pausedAt != null ? this.pausedAt : this.now());
    return Math.max(0, t - this.startAt - this.pausedMs);
  };

  /* ---------- Metriche dalle serie temporali ---------- */
  W.DURS = [5, 15, 30, 60, 300, 600, 1200, 3600];
  W.MIN_COVERAGE = 0.95;

  /* Porta una serie (time[], values[]) su una griglia a 1 s. Un campione vale fino al successivo
     solo se questo arriva entro maxHold secondi; oltre, i secondi restano mancanti (NaN). */
  W.grid = function (time, values, maxHold) {
    maxHold = maxHold || 5;
    const n = time ? time.length : 0;
    if (!n || !values) return [];
    const t0 = time[0];
    const T = Math.round(time[n - 1] - t0) + 1;
    const g = new Array(T).fill(NaN);
    for (let i = 0; i < n; i++) {
      const v = values[i];
      if (v == null || !isFinite(v)) continue;
      const a = Math.round(time[i] - t0);
      let span = i < n - 1 ? Math.round(time[i + 1] - time[i]) : 1;
      if (span > maxHold || span < 1) span = 1;
      for (let s = a; s < a + span && s < T; s++) g[s] = v;
    }
    return g;
  };

  /* Massima media su una finestra di d secondi di tempo reale. La finestra conta solo se
     almeno minCov dei suoi secondi ha un campione; la media è sui campioni presenti. */
  W.maxMean = function (g, d, minCov) {
    minCov = minCov == null ? W.MIN_COVERAGE : minCov;
    if (g.length < d) return null;
    let sum = 0, cnt = 0, best = null;
    const need = Math.ceil(d * minCov);
    for (let i = 0; i < g.length; i++) {
      if (!isNaN(g[i])) { sum += g[i]; cnt++; }
      if (i >= d && !isNaN(g[i - d])) { sum -= g[i - d]; cnt--; }
      if (i >= d - 1 && cnt >= need) {
        const m = sum / cnt;
        if (best == null || m > best) best = m;
      }
    }
    return best;
  };

  /* Normalized Power: media mobile a 30 s (finestre con almeno 27 campioni), elevata alla quarta,
     media, radice quarta. Restituita solo con almeno 20 minuti di finestre valide. */
  W.normalizedPower = function (g) {
    const d = 30, need = 27;
    let sum = 0, cnt = 0, s4 = 0, n = 0;
    for (let i = 0; i < g.length; i++) {
      if (!isNaN(g[i])) { sum += g[i]; cnt++; }
      if (i >= d && !isNaN(g[i - d])) { sum -= g[i - d]; cnt--; }
      if (i >= d - 1 && cnt >= need) { s4 += Math.pow(sum / cnt, 4); n++; }
    }
    if (n < 1200) return null;
    return Math.pow(s4 / n, 0.25);
  };

  function stats(g) {
    let s = 0, n = 0, mx = null;
    for (const v of g) if (!isNaN(v)) { s += v; n++; if (mx == null || v > mx) mx = v; }
    return { n: n, avg: n ? s / n : null, max: mx };
  }
  function hist(g, bin, lo, nb) {
    const h = new Array(nb).fill(0);
    for (const v of g) if (!isNaN(v)) { let k = Math.floor((v - lo) / bin); if (k < 0) k = 0; if (k >= nb) k = nb - 1; h[k]++; }
    while (h.length && h[h.length - 1] === 0) h.pop();
    return h;
  }
  W.PBIN = 10; W.HBIN = 5; W.HLO = 40;

  /* Analisi di una attività o sessione. Non dipende dall'FTP: zone, IF e TSS si derivano dopo. */
  W.analyze = function (st) {
    const out = { v: 2, hasPower: false, hasHr: false };
    if (!st || !st.time || !st.time.length) return out;
    const T = Math.round(st.time[st.time.length - 1] - st.time[0]) + 1;
    out.dur = T;
    if (st.watts) {
      const g = W.grid(st.time, st.watts);
      const s = stats(g);
      if (s.n > 0) {
        out.hasPower = true;
        out.pSec = s.n; out.pCov = s.n / T;
        out.avgP = s.avg; out.maxP = s.max;
        const np = W.normalizedPower(g);
        out.np = np;
        out.curve = {};
        for (const d of W.DURS) { const m = W.maxMean(g, d); if (m != null) out.curve[d] = Math.round(m); }
        out.ph = hist(g, W.PBIN, 0, 200);
      }
    }
    if (st.heart_rate) {
      const g = W.grid(st.time, st.heart_rate);
      const s = stats(g);
      if (s.n > 0) {
        out.hasHr = true;
        out.hSec = s.n; out.hCov = s.n / T;
        out.avgHr = s.avg; out.maxHr = s.max;
        out.hh = hist(g, W.HBIN, W.HLO, 40);
      }
    }
    if (st.cadence) {
      const g = W.grid(st.time, st.cadence).map(v => (v > 0 ? v : NaN));
      const s = stats(g);
      if (s.n > 0) out.avgCad = s.avg;
    }
    return out;
  };

  /* secondi per zona di potenza da istogramma (bin da 10 W, valore = centro del bin) */
  W.powerZoneSecs = function (ph, ftp) {
    const z = [0, 0, 0, 0, 0, 0, 0];
    if (!ph || !ftp) return null;
    for (let k = 0; k < ph.length; k++) if (ph[k]) z[W.zoneOfFrac(((k + 0.5) * W.PBIN) / ftp) - 1] += ph[k];
    return z;
  };
  W.hrZoneSecs = function (hh, maxes) {
    const z = [0, 0, 0, 0, 0];
    if (!hh || !maxes || maxes.length < 4) return null;
    for (let k = 0; k < hh.length; k++) if (hh[k]) z[W.zoneOfHr(W.HLO + (k + 0.5) * W.HBIN, maxes) - 1] += hh[k];
    return z;
  };
  /* IF e TSS: richiedono NP (quindi almeno 20 min di dati) e una FTP. TSS = t × NP × IF / (FTP × 3600) × 100,
     con t = secondi con dato di potenza. */
  W.load = function (an, ftp) {
    if (!an || an.np == null || !ftp) return null;
    const IF = an.np / ftp;
    return { np: an.np, IF: IF, tss: (an.pSec * an.np * IF) / (ftp * 3600) * 100 };
  };
  /* FTP in vigore a una data: ultima voce dello storico con data <= giorno. */
  W.ftpAt = function (hist, day, fallback) {
    let best = null;
    for (const h of hist || []) if (h.date <= day && (!best || h.date >= best.date)) best = h;
    if (best) return { ftp: best.ftp, exact: true };
    return fallback ? { ftp: fallback, exact: false } : null;
  };

  /* ---------- Classificazione attività Strava ---------- */
  const BIKE = ['Ride', 'GravelRide', 'MountainBikeRide', 'EBikeRide', 'EMountainBikeRide', 'Handcycle', 'Velomobile'];
  W.classify = function (a) {
    if (a.sport === 'VirtualRide') return { cat: 'virt', sure: /zwift/i.test(a.name || ''), note: /zwift/i.test(a.name || '') ? '' : 'Pedalata virtuale: Strava non indica la piattaforma, Zwift è presunto.' };
    if (BIKE.indexOf(a.sport) >= 0) {
      if (a.trainer) return { cat: 'indoor', sure: true, note: '' };
      if (!a.dist) return { cat: 'indoor', sure: false, note: 'Nessuna distanza registrata: classificata indoor, ma Strava non la marca come rullo.' };
      return { cat: 'outdoor', sure: true, note: '' };
    }
    return { cat: 'other', sure: true, note: '' };
  };

  /* ---------- Parser Bluetooth ---------- */
  /* FTMS Indoor Bike Data (0x2AD2) */
  W.parseIndoorBike = function (dv) {
    const r = {};
    if (dv.byteLength < 2) return r;
    const f = dv.getUint16(0, true);
    let o = 2;
    const has = n => o + n <= dv.byteLength;
    if (!(f & 1)) { if (!has(2)) return r; r.speed = dv.getUint16(o, true) / 100; o += 2; }
    if (f & 2) o += 2;
    if (f & 4) { if (!has(2)) return r; r.cadence = dv.getUint16(o, true) / 2; o += 2; }
    if (f & 8) o += 2;
    if (f & 16) o += 3;
    if (f & 32) o += 2;
    if (f & 64) { if (!has(2)) return r; r.power = dv.getInt16(o, true); o += 2; }
    if (f & 128) o += 2;
    if (f & 256) o += 5;
    if (f & 512) { if (!has(1)) return r; r.hr = dv.getUint8(o); o += 1; }
    return r;
  };
  /* Cycling Power Measurement (0x2A63) */
  W.parseCyclingPower = function (dv) {
    if (dv.byteLength < 4) return {};
    return { power: dv.getInt16(2, true) };
  };
  /* Heart Rate Measurement (0x2A37) */
  W.parseHeartRate = function (dv) {
    if (dv.byteLength < 2) return {};
    const f = dv.getUint8(0);
    if (f & 1) return dv.byteLength >= 3 ? { hr: dv.getUint16(1, true) } : {};
    return { hr: dv.getUint8(1) };
  };
  /* Fitness Machine Feature (0x2ACC): bit 3 dei target = potenza impostabile (ERG) */
  W.ftmsPowerTarget = function (dv) {
    if (dv.byteLength < 8) return false;
    return (dv.getUint32(4, true) & 8) !== 0;
  };
  W.ergCommand = function (watts) {
    const w = Math.max(0, Math.min(2000, Math.round(watts)));
    return new Uint8Array([0x05, w & 0xff, (w >> 8) & 0xff]);
  };

  /* ---------- Vista: Allenamenti ---------- */
  const pct = p => Math.round(p * 100) + '%';

  function ivLine(b, ftp) { return W.fmtTime(b.d) + ' al ' + pct(b.p) + (ftp ? ' · ' + W.targetWatts(ftp, b.p) + ' W' : '') + (b.c ? ' · ' + b.c + ' rpm' : ''); }
  function intervals(blocks, ftp) {

    while (i < blocks.length) {

        let j = i, d = 0; while (j < blocks.length && blocks[j].k === b.k) { d += blocks[j].d; j++; }
        h += row(W.fmtTime(d), W.zoneOfFrac(blocks[j - 1].p), (b.k === 'wu' ? 'Riscaldamento' : 'Defaticamento') + ' dal ' + pct(b.p) + ' al ' + pct(blocks[j - 1].p) + (ftp ? ' · ' + W.targetWatts(ftp, b.p) + '→' + W.targetWatts(ftp, blocks[j - 1].p) + ' W' : ''));
        i = j; continue;
      }

      if (r >= 2) { h += row(r + ' ×', W.zoneOfFrac(b.p), ivLine(b, ftp) + ' + ' + ivLine(blocks[i + 1], ftp)); i += 2 * r; continue; }
      h += row(W.fmtTime(b.d), W.zoneOfFrac(b.p), 'al ' + pct(b.p) + (ftp ? ' · ' + W.targetWatts(ftp, b.p) + ' W' : '') + (b.c ? ' · ' + b.c + ' rpm' : '') + ' · ' + W.blockLabel(b));

  function noteBox(text, act, v) {

    h += '<div class="card"><h3>Zone cardiache</h3><div class="row" style="align-items:flex-end">' + [0, 1, 2, 3].map(i => '<div class="field"><label for="in-hz' + i + '">Z' + (i + 1) + ' fino a (bpm)</label><input type="number" id="in-hz' + i + '" min="60" max="230" step="1" inputmode="numeric" style="max-width:110px" value="' + (z[i] || '') + '"></div>').join('') + '<button class="btn pri" data-act="saveHr">Salva zone</button>' + (strava.hrz ? '<button class="btn" data-act="useStravaHr">Importa da Strava</button>' : '') + '</div><p class="small mut">Z5 è tutto ciò che supera il limite di Z4. ' + (P.hrSrc === 'strava' ? 'Valori attuali importati da Strava.' : P.hrz ? 'Valori inseriti a mano.' : 'Nessun valore impostato.') + '</p>' +
      '<div class="row" style="align-items:flex-end"><div class="field"><label for="in-rest">FC a riposo (bpm)</label><input type="number" id="in-rest" min="30" max="100" step="1" inputmode="numeric" style="max-width:110px" value="' + (P.restHr || '') + '"></div><div class="field"><label for="in-lthr">FC di soglia (bpm)</label><input type="number" id="in-lthr" min="100" max="220" step="1" inputmode="numeric" style="max-width:110px" value="' + (P.lthr || '') + '" placeholder="' + (P.hrz ? P.hrz[2] + 1 : '') + '"></div><button class="btn" data-act="saveHrRef">Salva</button></div><p class="small mut">Servono a stimare il carico dalle attività senza potenza. FC di soglia: la FC che tieni per circa un’ora al massimo; se vuota si usa l’inizio della tua Z4 (' + (P.hrz ? P.hrz[2] + 1 : '—') + ' bpm).</p></div>';
    h += '<div class="card"><h3>Dispositivi</h3><div class="row"><span class="mut">Attrezzo</span><div class="seg" role="group" aria-label="Attrezzo"><button class="' + (P.mode === 'cyclette' ? 'on' : '') + '" data-act="mode" data-v="cyclette">Cyclette</button><button class="' + (P.mode === 'rivo' ? 'on' : '') + '" data-act="mode" data-v="rivo">Elite Rivo</button></div></div>' + devicesBlock() + '<p class="small mut"><b>Elite Rivo.</b> Secondo la scheda tecnica Elite trasmette via Bluetooth con i protocolli FTMS, Power e Speed&amp;Cadence e non ha ANT+. WATT legge potenza e cadenza dal servizio FTMS e attiva l’ERG solo se il rullo dichiara di accettare un target di potenza. Il rullo regge due connessioni Bluetooth: se Zwift o un’altra app lo sta già controllando, l’ERG di WATT può essere rifiutato.</p><p class="small mut"><b>Frequenza cardiaca Garmin.</b> Il Vivoactive 5 deve avere attiva la trasmissione FC (Impostazioni → Sensori e accessori → FC al polso → Trasmetti FC). Il manuale Garmin parla di trasmissione verso dispositivi associati senza precisare il Bluetooth: se l’orologio non compare nell’elenco del browser, non è raggiungibile da qui e serve una fascia Bluetooth, oppure la funzione «bridge» del Rivo, che inoltra la FC di un sensore associato al rullo.</p></div>';
    if (SA) {
      h += '<div class="card"><h3>Caricamento diretto su Strava</h3>';
      if (UI.swMsg) h += '<p class="note bad">' + esc(UI.swMsg) + '</p>';
      if (swOn()) {
        h += '<div class="status"><span class="dot ok"></span><span>Collegato' + (SW.who ? ' come ' + esc(SW.who) : '') + ' · app Strava ' + CLIENT_ID + '</span></div>';
        if (!swRead()) h += '<p class="note warn">Per la Dashboard WATT deve anche leggere le tue attività. Ricollega e lascia spuntate tutte le voci.</p><div><button class="btn pri" data-act="swGo">Ricollega Strava</button></div>';
        h += '<div class="row"><label class="check"><input type="checkbox" id="opt-autoup" data-chg="autoUp"' + (P.autoUp ? ' checked' : '') + '>Carica in automatico a fine sessione</label></div>';
        if (swRead()) h += '<div class="status" id="syncline">' + syncLine() + '</div><div class="row" style="align-items:flex-end"><div class="field"><label for="in-months">Storico per la Dashboard</label><select id="in-months" data-chg="months"><option value="6"' + (P.months === 6 ? ' selected' : '') + '>6 mesi</option><option value="12"' + (P.months === 12 ? ' selected' : '') + '>12 mesi</option><option value="240"' + (P.months === 240 ? ' selected' : '') + '>Tutto lo storico</option></select></div><button class="btn" data-act="sync">Sincronizza ora</button></div><p class="small mut">Strava concede 100 richieste ogni 15 minuti: la prima analisi completa dello storico può richiedere più aperture dell’app.</p>';
        h += '<div><button class="btn sm ghost" data-act="swOff">Scollega Strava</button></div>';
      }
      else if (!canOAuth()) h += '<p class="note">Il caricamento diretto funziona solo quando la consolle è aperta da un indirizzo https (non da un file). Da qui usa «Scarica file per Strava».</p>';
      else h += '<p class="small">Una volta sola: su <b>strava.com/settings/api</b> imposta «Authorization Callback Domain» a <b>' + esc(location.hostname) + '</b>, poi copia il Client Secret qui.</p><div class="row" style="align-items:flex-end"><div class="field"><label for="in-secret">Client Secret (app ' + CLIENT_ID + ')</label><input type="password" id="in-secret" autocomplete="off" spellcheck="false" style="max-width:340px"></div><button class="btn pri" data-act="swGo">Collega Strava</button></div><p class="small mut">Il Client Secret resta solo in questo browser, su questo dispositivo: non viene inviato ad altri che a Strava e non compare nel codice o negli indirizzi. Chi usa questo browser potrebbe leggerlo: se lo cambi su Strava, ricollega qui.</p>';
      h += '</div>';
    }
    if (!SA) h += '<div class="card"><h3>Strava</h3><div class="status" id="syncline">' + syncLine() + '</div><div class="row" style="align-items:flex-end"><div class="field"><label for="in-months">Storico da importare</label><select id="in-months" data-chg="months"><option value="6"' + (P.months === 6 ? ' selected' : '') + '>6 mesi</option><option value="12"' + (P.months === 12 ? ' selected' : '') + '>12 mesi</option><option value="24"' + (P.months === 24 ? ' selected' : '') + '>24 mesi</option><option value="240"' + (P.months === 240 ? ' selected' : '') + '>Tutto lo storico</option></select></div><button class="btn pri" data-act="sync">Sincronizza ora</button><button class="btn ghost" data-act="clearActs">Svuota attività importate</button></div><p class="small mut">Il collegamento passa dal connettore Strava del tuo account Claude: nessun Client Secret, nessun token e nessun Callback Domain in questa pagina. È in sola lettura, quindi WATT non può caricare sessioni su Strava. L’importazione è incrementale e senza duplicati: ogni attività è salvata una sola volta con il suo identificativo Strava. Le attività importate restano in questo browser e si riscaricano su un altro dispositivo.</p></div>';
    h += '<div class="card"><h3>Avvisi e salvataggio</h3><div class="row"><label class="check"><input type="checkbox" id="set-voice" data-chg="voice"' + (P.voice ? ' checked' : '') + '>Avvisi vocali a inizio sessione, cambio intervallo e conclusione</label></div><div class="row" style="align-items:flex-end">' + voiceSelect('set-voicen') + '</div><p class="small mut">Le voci sono quelle installate sul dispositivo. Su Android le migliori sono le voci Google: se ne vedi poche, installale da Impostazioni di Android → Sistema → Lingue → Sintesi vocale → Motore Google → Installa dati vocali → Italiano.</p><div class="status"><span class="dot ' + (UI.store === 'account' ? 'ok' : 'run') + '"></span><span>' + (SA ? 'Consolle autonoma: impostazioni e sessioni restano in questo browser. FTP e zone sono quelle che avevi in WATT quando l’hai scaricata.' : UI.store === 'account' ? 'FTP, zone, programma e sessioni sono salvati nel tuo spazio privato di questa pagina e ti seguono su ogni dispositivo.' : 'FTP, zone, programma e sessioni sono salvati solo in questo browser' + (UI.storeErr ? ' (salvataggio sull’account non riuscito: ' + esc(UI.storeErr) + ')' : '') + '.') + '</span></div></div>';
    return h;
  }

  function setKg(date, kg, src) {
    const list = (P.weights || []).filter(x => x.date !== date);
    list.push({ date: date, kg: Math.round(kg * 10) / 10, src: src });
    list.sort((a, b) => (a.date < b.date ? -1 : 1));
    P.weights = list.slice(-2000);
  }
  async function importRenpho(input) {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    let text = '';
    try { text = await f.text(); } catch (e) { text = ''; }
    const r = W.parseWeightCsv(text);
    if (r.error) return openModal('<div class="row spread"><h2>File non riconosciuto</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>' + esc(r.error) + '</p><p class="small mut">Manda a Claude le prime tre righe del file: adatto il lettore al formato di Renpho.</p>');
    const manual = {};
    (P.weights || []).forEach(x => { if (x.src !== 'renpho') manual[x.date] = true; });
    let added = 0, kept = 0;
    r.rows.forEach(x => { if (manual[x.date]) { kept++; return; } setKg(x.date, x.kg, 'renpho'); added++; });
    save(); render();
    const lst = r.rows[r.rows.length - 1];
    openModal('<div class="row spread"><h2>Pesate importate</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>' + added + ' pesate dal ' + dmy(r.rows[0].date) + ' al ' + dmy(lst.date) + '. Ultima: <b>' + nf(lst.kg, 1) + ' kg</b>' + (P.ftp ? ' · FTP ' + nf(P.ftp / kgAt(today()).kg, 2) + ' W/kg' : '') + '.</p>' + (kept ? '<p class="small mut">' + kept + ' giorni avevano già un peso inserito a mano: tenuto quello.</p>' : '') + (r.skipped ? '<p class="small mut">' + r.skipped + ' righe senza data o peso valido sono state ignorate.</p>' : ''));
  }

  /* ---------- Rendering e azioni ---------- */
  const VIEWS = { dashboard: vDashboard, allenamenti: vAllenamenti, consolle: vConsolle, impostazioni: vImpostazioni };
  function render() {
    charts = [];
    document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + UI.view));
    $('#view').innerHTML = VIEWS[UI.view]();
    drawCharts();
  }
  function openModal(html) {
    const keep = charts.length;
    const m = $('#modal');
    m.innerHTML = '<div class="box">' + html + '</div>';
    m.hidden = false;
    for (const c of charts.slice(keep)) { const el = document.getElementById(c.id); if (el) el.innerHTML = c.fn(Math.max(260, el.clientWidth || 320)); }
  }
  function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
  const numVal = id => { const e = document.getElementById(id); const v = e ? parseFloat(e.value) : NaN; return isFinite(v) ? v : null; };

  const ACT = {
    sync: () => sync(),
    period: v => { UI.period = +v; render(); },
    runAll: v => { P.runAll = v === '1'; save(); render(); },
    runMov: v => { P.runMov = v === '1'; save(); render(); },
    cat: v => { UI.cat = v; render(); },
    detail: v => openDetail(v),
    close: () => closeModal(),
    dur: v => { UI.dur = v; render(); },
    goal: v => { UI.goal = v; render(); },
    toggle: v => { UI.open[v] = !UI.open[v]; render(); },
    pick: v => { UI.sel = v; LS.set('watt.sel', v); location.hash = '#consolle'; if (UI.view === 'consolle') render(); },
    plan: v => { const w = byId(v); openModal('<div class="row spread"><h2>Programma</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>' + esc(w.name) + ' · ' + w.dur + ' min</p><div class="row" style="align-items:flex-end"><div class="field"><label for="in-pd">Data</label><input type="date" id="in-pd" min="' + today() + '" value="' + today() + '"></div><button class="btn pri" data-act="planAdd" data-v="' + w.id + '">Aggiungi al programma</button></div>'); },
    planAdd: v => { const e = document.getElementById('in-pd'); const d = e && e.value; if (!d) return; P.plan = (P.plan || []).concat([{ id: 'p' + Date.now(), date: d, wid: v }]); save(); closeModal(); render(); },
    unplan: v => { P.plan = (P.plan || []).filter(p => p.id !== v); save(); render(); },
    mode: v => { P.mode = v; save(); render(); },
    btT: () => connectTrainer(), btH: () => connectHr(), btOffT: () => disconnect(T), btOffH: () => disconnect(H),
    start: () => startSession(false),
    restore: () => startSession(true),
    dropLive: () => { LS.del('watt.live'); render(); },
    pause: () => { if (!live) return; if (live.timer.running()) live.timer.pause(); else { live.timer.resume(); live.note = ''; wakeOn(); } tick(); },
    askEnd: () => { const c = $('#cs-confirm'); if (c) c.hidden = false; },
    keep: () => { const c = $('#cs-confirm'); if (c) c.hidden = true; },
    endSave: () => finish(true, false),
    endDrop: () => finish(false, false),
    fs: () => { try { const el = $('#console'); if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); } catch (e) { /* schermo intero non disponibile */ } },
    delSession: v => { P.sessions = (P.sessions || []).filter(s => s.id !== v); save(); render(); },
    saveFtp: () => { const v = numVal('in-ftp'); if (v == null || v < 50 || v > 600) return openModal('<div class="row spread"><h2>FTP non valida</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>Inserisci un valore tra 50 e 600 W.</p>'); setFtp(v, 'manuale'); render(); },
    useStravaFtp: () => { if (strava.ftp) { setFtp(strava.ftp, 'strava'); render(); } },
    addFtp: () => { const v = numVal('in-hf'), e = document.getElementById('in-hd'), d = e && e.value; if (v == null || v < 50 || v > 600 || !d || d > today()) return openModal('<div class="row spread"><h2>Voce non valida</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>Servono una data non futura e una FTP tra 50 e 600 W.</p>'); setFtp(v, 'manuale', d); render(); },
    delFtp: v => { P.ftpHist = (P.ftpHist || []).filter(h => h.date !== v); if (P.ftpHist.length) P.ftp = P.ftpHist[P.ftpHist.length - 1].ftp; save(); render(); },
    saveHr: () => { const z = [0, 1, 2, 3].map(i => numVal('in-hz' + i)); if (z.some(v => v == null) || !(z[0] < z[1] && z[1] < z[2] && z[2] < z[3])) return openModal('<div class="row spread"><h2>Zone non valide</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>Servono quattro limiti crescenti in bpm.</p>'); P.hrz = z.map(Math.round); P.hrSrc = 'manuale'; save(); render(); },
    useStravaHr: () => { if (strava.hrz) { P.hrz = strava.hrz.slice(); P.hrSrc = 'strava'; save(); render(); } },
    clearActs: () => { acts = {}; ans = {}; syncInfo = { at: null }; LS.del('watt.acts'); LS.del('watt.an'); LS.del('watt.sync'); setSync('idle', ''); render(); },
    useTestFtp: v => { const n = +v; if (n >= 50 && n <= 600) { setFtp(n, 'test'); closeModal(); render(); } },
    addKg: () => { const v = numVal('in-kg'), e = document.getElementById('in-kd'), d = e && e.value; if (v == null || v < 30 || v > 250 || !d || d > today()) return openModal('<div class="row spread"><h2>Peso non valido</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>Servono una data non futura e un peso tra 30 e 250 kg.</p>'); setKg(d, v, 'manuale'); save(); render(); },
    delKg: v => { P.weights = (P.weights || []).filter(x => x.date !== v); save(); render(); },
    copyNote: (v, b) => { const w = byId(v); if (w) copyText(W.stravaNote(w, P.ftp), b); },
    copySess: (v, b) => { const r = (P.sessions || []).find(x => x.id === v); if (r) copyText(sessNote(r), b); },
    tcx: v => downloadTcx(v),
    img: v => saveImage(v),
    upload: (v, b) => swUpload(v, b),
    swGo: () => swStart(),
    swOff: () => { const t = SW && SW.access; SW = null; LS.del('watt.sw'); if (t) fetch(SAPI + '/oauth/deauthorize', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).catch(() => {}); render(); },
    getSA: () => getStandalone(),
    saveHrRef: () => { const r = numVal('in-rest'), t = numVal('in-lthr'); if (r == null || r < 30 || r > 100 || (t != null && (t <= r + 20 || t > 220))) return openModal('<div class="row spread"><h2>Valori non validi</h2><button class="btn sm" data-act="close">Chiudi</button></div><p>FC a riposo tra 30 e 100 bpm; la FC di soglia, se indicata, deve essere ben sopra quella a riposo.</p>'); P.restHr = Math.round(r); P.lthr = t == null ? null : Math.round(t); save(); render(); },
    testVoice: () => { say('Soglia, dieci minuti, centottantasei watt.', true); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) { if (b.disabled) return; const f = ACT[b.dataset.act]; if (f) f(b.dataset.v, b, e); return; }
    if (e.target.id === 'modal') closeModal();
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.chg; if (!k) return;
    if (k === 'voice') { P.voice = !!e.target.checked; save(); if (UI.view === 'consolle' && !live) render(); }
    else if (k === 'erg') { P.erg = !!e.target.checked; save(); }
    else if (k === 'months') { P.months = +e.target.value || 6; save(); }
    else if (k === 'autoUp') { P.autoUp = !!e.target.checked; save(); }
    else if (k === 'voiceName') { P.voiceName = e.target.value || null; save(); say('Voce selezionata.', true); }
    else if (k === 'voiceRate') { P.voiceRate = +e.target.value || 1; save(); say('Velocità aggiornata.', true); }
    else if (k === 'renpho') importRenpho(e.target);
  });
  const tip = $('#tip');
  function showTip(e) {
    const g = e.target.closest && e.target.closest('[data-tip]');
    if (!g) { tip.hidden = true; return; }
    tip.textContent = g.dataset.tip; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(6, Math.min(e.clientX + 12, window.innerWidth - w - 6)) + 'px';
    tip.style.top = Math.max(6, e.clientY - h - 12) + 'px';
  }
  document.addEventListener('pointermove', showTip);
  document.addEventListener('pointerdown', showTip);
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && live) { tick(); if (live.timer.running()) wakeOn(); } });
  function route() {
    const v = (location.hash || '').replace('#', '');
    UI.view = VIEWS[v] ? v : (SA ? 'consolle' : 'dashboard');
    if (!live) { render(); window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', route);

  /* ---------- Avvio ---------- */
  P.plan = (P.plan || []).filter(p => p.date >= localDay(new Date(Date.now() - 7 * 864e5)));
  UI.sel = LS.get('watt.sel');
  if (UI.sel && !byId(UI.sel)) UI.sel = null;
  const todayPlan = (P.plan || []).find(p => p.date === today() && byId(p.wid));
  if (!UI.sel && todayPlan) UI.sel = todayPlan.wid;
  if (SA) document.body.classList.add('sa');
  route();
  function startDirect() {
    if (!SA || !swRead()) return;
    mcp = stravaDirect;
    if (!syncInfo.at || Date.now() - syncInfo.at > 30 * 60e3) sync(); else analyzeQueue();
  }
  if (SA && /[?&](code|error)=/.test(location.search)) swConnectFinish().then(() => { if (!live) { if (!location.hash) location.hash = '#impostazioni'; render(); } startDirect(); });
  else startDirect();
  if (!SA) initStore();
  if (!SA) use('mcp').then(m => {
    mcp = m;
    if (!m) { setSync(syncInfo.at ? 'ok' : 'err', syncInfo.at ? 'collegamento a Strava non disponibile in questa vista' : NOVIEW); return; }
    if (!syncInfo.at || Date.now() - syncInfo.at > 30 * 60e3) sync(); else analyzeQueue();
  });

  window.__watt = { state: () => ({ P: P, acts: acts, ans: ans, UI: UI, live: live }), tick: tick, img: id => { const r = (P.sessions || []).find(x => x.id === id), c = r && workoutCanvas(r); return c ? c.toDataURL('image/png') : null; } };
})();

</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});</script>
